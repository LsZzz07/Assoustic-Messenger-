name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev
      - name: Install buildozer
        run: pip install --upgrade pip buildozer cython==0.29.36 setuptools
      - name: Build APK
        shell: bash
        run: buildozer android debug 2>&1 | tee build.log
      - name: Show the error
        if: failure()
        run: |
          echo "=== LAST 40 LINES ==="
          tail -n 40 build.log
          echo "=== ERROR LINES ==="
          grep -n -i -E "error|traceback|failed|not found" build.log | tail -n 25
      - uses: actions/upload-artifact@v4
        with:
          name: AcousticMessenger-apk
          path: bin/*.apk
